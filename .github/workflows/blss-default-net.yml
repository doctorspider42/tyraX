# Guards resources/blss-default.net - the trained network the editor SHIPS, so
# that a project with no blss.net of its own is built with a real net instead of
# random weights (docs/neural-upscaler.md, "The net that ships").
#
# It exists because that file is the one artefact in this repo that nothing else
# can check. Every other generated thing is regenerated by the build; the
# default net is 500 bytes fitted by a 44-second training run that nobody is
# going to re-run by hand, and both ways it can rot are silent:
#
#   1. THIS BUILD STOPS BEING ABLE TO READ IT. `kNetVersion`, `kFeatures`,
#      `kHidden` or `kTile` moves and the asset is not refitted in the same
#      commit. Nothing fails to compile - `blssBake()` simply falls through to
#      the random init it was written to replace, and the only trace is one line
#      in the generated header and one in the game's boot log.
#   2. IT STOPS BEING WHAT ITS SIDECAR SAYS IT IS. The corpus (the seven example
#      projects) or the trainer changes, the net is not refitted, and
#      resources/blss-default.net.meta goes on describing a run that no longer
#      produces those bytes. The sidecar carries no timestamp and no editor
#      version precisely so that "re-run the recorded command and diff" is a
#      test with a meaningful answer - this is the job that asks it.
#
# The two steps below are one each, and they are cheap: the emit is instant and
# the retrain is ~51 s locally (measured: corpus 13.6 s, oracle 19.7 s, fit
# 17.5 s). The build of the editor is the only real cost, which is why ccache is
# cached across runs.
#
# WHAT THIS JOB CANNOT PROVE, said out loud. The md5 anchor was produced by
# MinGW g++ on Windows; the trainer is deterministic and thread-count
# independent (checked with --threads 1 against every core), but it is not
# proven bit-identical ACROSS TOOLCHAINS - the oracle and the Adam loop run host
# floats. If the reproduction step fails while step 1 passes and no BLSS source
# changed, that is the finding: the anchor is platform-bound and belongs in a
# matrix, not in one runner. Do not "fix" it by deleting the diff.
name: blss-default-net

# The two path lists are duplicated rather than shared through a YAML anchor,
# because the workflow parser does not expand aliases in `on:`. Edit them as a
# pair.
#
# What is in them: src/blss.hpp for the topology constants and kNetVersion (the
# reason a net stops being readable at all); src/blss.cpp for the trainer, the
# oracle and the emitter - not in this job's original scope and included anyway,
# because a change there changes the weights the recorded command produces,
# which is exactly the drift step 2 is for; blsscorpus.* and blssscene.* for
# what the 55 shots ARE; the seven example projects of the recorded corpus, in
# the sidecar's own order, because a scene edit in any of them changes the net;
# the artefact itself, so a hand-replaced net is asked the same two questions as
# a code change; and cmake/embed_binary.cmake, which is what puts the asset INTO
# the binary - break that and step 1 is exactly the check that notices.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/blss.hpp
      - src/blss.cpp
      - src/blsscorpus.cpp
      - src/blsscorpus.hpp
      - src/blssscene.cpp
      - src/blssscene.hpp
      - examples/upscaler-lab/**
      - examples/material-lab/**
      - examples/endless-runner/**
      - examples/cube/**
      - examples/save-points/**
      - examples/procedural/**
      - examples/endless-scroller/**
      - resources/blss-default.net
      - resources/blss-default.net.meta
      - cmake/embed_binary.cmake
      - .github/workflows/blss-default-net.yml
  pull_request:
    paths:
      - src/blss.hpp
      - src/blss.cpp
      - src/blsscorpus.cpp
      - src/blsscorpus.hpp
      - src/blssscene.cpp
      - src/blssscene.hpp
      - examples/upscaler-lab/**
      - examples/material-lab/**
      - examples/endless-runner/**
      - examples/cube/**
      - examples/save-points/**
      - examples/procedural/**
      - examples/endless-scroller/**
      - resources/blss-default.net
      - resources/blss-default.net.meta
      - cmake/embed_binary.cmake
      - .github/workflows/blss-default-net.yml

concurrency:
  group: blss-default-net-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup.sh --deps installs the distro toolchain and dev headers from the
      # ONE dependency list (deps.sh) and clones the vendored libraries; it also
      # installs ccache, which CMake picks up off PATH by itself.
      - name: Toolchain and dependencies
        run: ./setup.sh --deps

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: blss-ccache-${{ github.sha }}
          restore-keys: blss-ccache-

      - name: Build the editor
        run: ./build.sh

      # STEP 1: CAN THIS BUILD READ THE NET IT SHIPS?
      #
      # `--blss-emit` resolves a net the same way the bake does - an explicit
      # -i, else the project's own blss.net, else the embedded default - so
      # running it from a directory with NO blss.net is the cheapest possible
      # exercise of the fallback path. `--act-table 0` is load-bearing and not
      # decoration: with the shipped 512 the verb emits the ACTIVATION TABLE
      # instead of the network and never touches the asset at all.
      #
      # A default that cannot be read is `blss: ...` on stdout and exit 1. The
      # REFUSED grep is the second half: checkProvenance() refuses on version,
      # topology and tile, but it refuses by PRINTING - a sidecar describing a
      # net these weights are not would otherwise leave this step green.
      #
      # EXPECTED NOISE, so nobody chases it: because `--act-table 0` is what
      # gets us past that early return, this step always prints one
      # `[blss] net warning: fitted against activation table 512, this run
      # evaluates it against 0`. That warning is produced BY the check, not
      # found by it - which is why only REFUSED is grepped, and why the
      # activation table is verified through the sidecar diff in step 2 instead.
      - name: The shipped default is readable by this build
        run: |
          set -e
          exe="$PWD/build/tyrax-editor"
          out="$(mktemp -d)"
          cd "$out"                 # deliberately empty: no blss.net anywhere
          "$exe" --blss-emit --act-table 0 -o ./blss_net.gen.hpp | tee emit.log
          grep -q '\[blss\] net source=default' emit.log \
            || { echo "FAIL: the embedded default was not the net that resolved"; exit 1; }
          ! grep -q 'net REFUSED' emit.log \
            || { echo "FAIL: the sidecar does not describe a net this build can use"; exit 1; }
          test -s ./blss_net.gen.hpp
          echo "the editor's own net loads, and its provenance matches this build"

      # STEP 2: IS IT STILL WHAT ITS SIDECAR SAYS IT IS?
      #
      # The sidecar records the whole invocation with argv[0] replaced by the
      # tool's name, so re-running it is a matter of substituting the binary -
      # and it carries no timestamp and no editor version, which is the only
      # reason a byte diff of the RESULT means anything. Both files are diffed:
      # the weights are the artefact and the sidecar is the claim about them,
      # and either drifting from the other is the failure.
      - name: The shipped default is reproducible from its own recorded command
        run: |
          set -e
          meta=resources/blss-default.net.meta
          cmd="$(sed -n 's/^command tyrax-editor //p' "$meta")"
          test -n "$cmd" || { echo "FAIL: no 'command' line in $meta"; exit 1; }
          echo "re-running: ./build/tyrax-editor $cmd"
          # shellcheck disable=SC2086 - the recorded command is a plain argv
          ./build/tyrax-editor $cmd
          md5sum resources/blss-default.net
          echo "879146bdee7f3b183c05985012753649  resources/blss-default.net" | md5sum -c - \
            || { echo "FAIL: the net's bytes moved - see the note at the top of this file"; exit 1; }
          git diff --exit-code -- resources/blss-default.net resources/blss-default.net.meta \
            || { echo "FAIL: re-running the recorded command does not reproduce the tree."; \
                 echo "      Refit the default in the same commit as whatever moved:"; \
                 echo "        ./build/tyrax-editor $cmd"; exit 1; }
          echo "byte-identical: the shipped net is the net that command produces"

      - name: Summary
        if: always()
        run: |
          {
            echo "### The BLSS net that ships"
            echo
            sed -n 's/^corpus /**Corpus:** /p;s/^shots /**Shots:** /p;s/^net-version /**Net version:** /p' \
              resources/blss-default.net.meta
            echo
            echo 'A project with no `blss.net` of its own is built with this one.'
            echo 'Refit it in the same commit as any change to the topology, the'
            echo 'trainer or the corpus:'
            echo
            echo '```'
            sed -n 's/^command //p' resources/blss-default.net.meta
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
