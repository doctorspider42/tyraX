# Publishes the TyraX VS Code extension (tools/vscode-tyrax) to the Visual
# Studio Marketplace and Open VSX. Manual on purpose: a store refuses a version
# it already has, so a release is "bump package.json, repackage, dispatch".
# Secrets: VSCE_PAT (Marketplace, publisher `tyrax`), OVSX_PAT (Open VSX,
# namespace `tyrax`); a step whose secret is missing is skipped.
# See docs/vscode-extension.md, "Publishing".
name: vscode-extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline checks
        run: |
          node tools/vscode-tyrax/test/debug.test.js
          node tools/vscode-tyrax/test/activate.test.js
          node tools/vscode-tyrax/test/stale.test.js
          node tools/vscode-tyrax/test/restart.test.js
      - name: Package
        id: pkg
        run: |
          python3 tools/vscode-tyrax/package-vsix.py
          echo "vsix=$(ls tools/vscode-tyrax/*.vsix)" >> "$GITHUB_OUTPUT"
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --packagePath "${{ steps.pkg.outputs.vsix }}" -p "$VSCE_PAT"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0 publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pkg.outputs.vsix }}
