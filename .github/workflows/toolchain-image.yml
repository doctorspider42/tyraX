# Builds and publishes the TyraX toolchain image - what generated games are
# compiled in (docs/toolchain-image.md).
#
#   docker/Dockerfile.fromsource -> ghcr.io/<owner>/tyrax-toolchain-src
#
# The official ps2dev base with openvcl, vclpp and bin2s built from source, the
# audsrv fork compiled by the image's own toolchain, and our patched ps2link. No
# unlicensed binary anywhere in it. amd64 by default; arm64 works and is asked
# for through the `platforms` input (see "The arm64 question" in the docs).
#
# The OTHER Dockerfile in docker/ is deliberately absent from this workflow.
# `docker/Dockerfile` inherits from h4570/tyra and is the only image that can run
# Sony's `vcl`, which makes it the reference every A/B in the docs is measured
# against - and a reference is needed rarely, by whoever is doing the comparison.
# So it stays in the repo and stays buildable (`docker/build.ps1`, `build.sh`,
# with -VclImpl/--vcl-impl as the assembler A/B knob) but is not published: a
# second job on every push to docker/ and a second GHCR package are a standing
# cost for something used a few times a year. The consequence is worth stating
# plainly - a change to that Dockerfile gets NO CI coverage, so build it locally
# before committing one.
#
# Publishing target is GHCR because it needs no secrets: GITHUB_TOKEN can push
# packages of its own repo. The package inherits the repository's visibility on
# first push, so while this repo is PRIVATE the image is pullable only with a
# token - which is why generated projects still default to h4570/tyra and only
# switch over via TYRAX_IMAGE (see docs/toolchain-image.md). Once the repo is
# public, make the package public in its GHCR settings and flip that default.
#
# Pull requests build the image and run the checks but never push - a PR from a
# fork has no package write access, and an unreviewed image must not become the
# thing everyone pulls.
name: toolchain-image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR (uncheck to build and check only)'
        type: boolean
        default: true
      platforms:
        description: 'Target platforms (empty = linux/amd64; arm64 also builds: linux/amd64,linux/arm64)'
        default: ''
  push:
    branches: [main]
    paths:
      - docker/**
      - vendor/tyra/audsrv/**
      - tools/ps2link/tyrax.patch
      - .github/workflows/toolchain-image.yml
  pull_request:
    paths:
      - docker/**
      - vendor/tyra/audsrv/**
      - tools/ps2link/tyrax.patch
      - .github/workflows/toolchain-image.yml

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REG: ghcr.io/${{ github.repository_owner }}
  PACKAGE: tyrax-toolchain-src

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve platforms
        id: plat
        run: echo "value=${{ inputs.platforms || 'linux/amd64' }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(steps.plat.outputs.value, 'arm64')
        uses: docker/setup-qemu-action@v3

      # Load a single-platform image into the runner's docker so the checks
      # below run against the actual artifact. buildx caches the layers, so the
      # push step afterwards is not a second build.
      #
      # No `platforms:` here on purpose - `load: true` cannot take a multi-arch
      # result, so this builds the runner's own arch. The consequence is worth
      # stating: an arm64 half asked for through the input is BUILT by the push
      # step and never RUN by these checks. Checking it needs an arm64 runner,
      # or qemu plus a second load - neither is free, and a compile failure
      # would still fail the build.
      - name: Build (load for checking)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.fromsource
          load: true
          tags: tyrax-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the layers ran. These are the failures that
      # would otherwise surface as a broken game build on someone's machine: a
      # missing tool, a `vcl` that cannot start (openvcl and vclpp need
      # libstdc++, which the ps2dev base does not ship), or an audsrv that is
      # not the fork - which does not fail here at all, it fails as an
      # unresolved AUDSRV_ADPCM_CH_CORE deep in an engine compile.
      - name: Check the image
        run: |
          docker run --rm tyrax-toolchain:ci sh -c '
            set -e
            for t in vcl vclpp openvcl bin2s make rsync mips64r5900el-ps2-elf-g++ dvp-as; do
                command -v "$t" >/dev/null \
                  || [ -x /usr/local/ps2dev/ps2sdk/bin/"$t" ] \
                  || { echo "MISSING: $t"; exit 1; }
            done
            # Which assembler `vcl` resolves to is a property of the image, so
            # assert it rather than trust the build.
            test "$(cat /usr/local/share/tyrax/vcl-impl)" = openvcl
            vclpp 2>&1 | grep -q Usage
            printf ".init_vf_all\n.init_vi_all\n--enter\n--endenter\n\tadd.xyzw\tvf01, vf00, vf00\n--exit\n--endexit\n" > /tmp/t.vcl
            vcl /tmp/t.vcl > /tmp/t.vsm
            [ -s /tmp/t.vsm ]
            dvp-as /tmp/t.vsm -o /tmp/t.o
            printf "int main(){return 0;}\n" > /tmp/t.c
            mips64r5900el-ps2-elf-gcc /tmp/t.c -o /tmp/t.elf
            # The audsrv fork, both halves of it: the header the engine compiles
            # against, and a library that actually LINKS with this toolchain.
            # --whole-archive is the point - a main() referencing nothing never
            # makes the linker open the archive members.
            grep -q AUDSRV_ADPCM_CH_CORE /usr/local/ps2dev/ps2sdk/ee/include/audsrv.h
            mips64r5900el-ps2-elf-gcc /tmp/t.c \
              -Wl,--whole-archive /usr/local/ps2dev/ps2sdk/ee/lib/libaudsrv.a \
              -Wl,--no-whole-archive -o /tmp/audsrv.elf
            test -s /usr/local/share/tyrax/ps2link/ps2link.elf
            test -s /usr/local/share/tyrax/ps2link/ps2link-low-nousb-packed.elf
            echo "image OK"
          '
          echo "--- toolchain identity (must not drift silently):"
          docker run --rm tyrax-toolchain:ci sh -c 'mips64r5900el-ps2-elf-g++ --version | head -1; vclpp 2>&1 | head -3'

      # The console loader, so it can be downloaded without pulling the image
      # (docs/ps2link-setup.md). Retention is the default 90 days; the image
      # itself is the durable copy.
      - name: Extract ps2link
        run: |
          cid=$(docker create tyrax-toolchain:ci)
          mkdir -p artifacts
          docker cp "$cid:/usr/local/share/tyrax/ps2link/." artifacts/
          docker rm "$cid" > /dev/null
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ps2link
          path: artifacts/*.elf
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest for humans, :sha-<commit> as the thing to pin a project to when a
      # build has to be reproducible (TYRAX_IMAGE takes any reference).
      - name: Push
        if: github.event_name != 'pull_request' && inputs.push != false
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.fromsource
          push: true
          platforms: ${{ steps.plat.outputs.value }}
          tags: |
            ${{ env.REG }}/${{ env.PACKAGE }}:latest
            ${{ env.REG }}/${{ env.PACKAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### TyraX toolchain image"
            echo
            echo '`'"${REG}/${PACKAGE}"'`'  "(${{ steps.plat.outputs.value }})"
            echo
            echo "Point a project at it with one line in the project directory:"
            echo
            echo '```'
            echo "TYRAX_IMAGE=${REG}/${PACKAGE}:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "written to \`.env\` - see docs/toolchain-image.md."
          } >> "$GITHUB_STEP_SUMMARY"
