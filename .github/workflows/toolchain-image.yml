# Builds and publishes the TyraX toolchain image - the image generated games are
# compiled in (docker/Dockerfile, docs/toolchain-image.md).
#
# Publishing target is GHCR, ghcr.io/<owner>/tyrax-toolchain, because it needs no
# secrets: GITHUB_TOKEN can push packages of its own repo. The package inherits
# the repository's visibility on first push, so while this repo is PRIVATE the
# image is pullable only with a token - which is why generated projects still
# default to h4570/tyra and only switch over via TYRAX_IMAGE (see
# docs/toolchain-image.md). Once the repo is public, make the package public in
# its GHCR settings and flip that default.
#
# Pull requests build the image and run the checks but never push - a PR from a
# fork has no package write access, and an unreviewed image must not become the
# thing everyone pulls.
name: toolchain-image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR (uncheck to build and check only)'
        type: boolean
        default: true
      platforms:
        description: 'Target platforms'
        default: linux/amd64
  push:
    branches: [main]
    paths:
      - docker/**
      - tools/ps2link/tyrax.patch
      - .github/workflows/toolchain-image.yml
  pull_request:
    paths:
      - docker/**
      - tools/ps2link/tyrax.patch
      - .github/workflows/toolchain-image.yml

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tyrax-toolchain

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image inherits a digest-pinned Ubuntu/glibc toolchain layer that
      # exists for linux/amd64 only, so amd64 is the honest default. Building
      # linux/arm64 needs a toolchain layer that has an arm64 manifest first -
      # see "The arm64 question" in docs/toolchain-image.md.
      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      # Load a single-platform image into the runner's docker so the checks
      # below run against the actual artifact. buildx caches the layers, so the
      # push step afterwards is not a second build.
      - name: Build (load for checking)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: tyrax-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the layers ran. These are the failures that
      # would otherwise surface as a broken game build on someone's machine:
      # a missing tool, or a vcl that cannot run (it is a 32-bit x86 binary and
      # needs the image's i386 runtime).
      - name: Check the image
        run: |
          docker run --rm tyrax-toolchain:ci sh -c '
            set -e
            for t in vcl vclpp openvcl make rsync mips64r5900el-ps2-elf-g++ dvp-as; do
                command -v "$t" >/dev/null || { echo "MISSING: $t"; exit 1; }
            done
            # Which assembler `vcl` resolves to is a property of the image, so
            # assert it rather than trust the build argument (see VCL_IMPL).
            test "$(cat /usr/local/share/tyrax/vcl-impl)" = "legacy"
            vclpp 2>&1 | grep -q Usage
            printf ".init_vf_all\n.init_vi_all\n--enter\n--endenter\n\tadd.xyzw\tvf01, vf00, vf00\n--exit\n--endexit\n" > /tmp/t.vcl
            vcl /tmp/t.vcl > /tmp/t.vsm
            [ -s /tmp/t.vsm ]
            dvp-as /tmp/t.vsm -o /tmp/t.o
            printf "int main(){return 0;}\n" > /tmp/t.c
            mips64r5900el-ps2-elf-gcc /tmp/t.c -o /tmp/t.elf
            test -s /usr/local/share/tyrax/ps2link/ps2link.elf
            test -s /usr/local/share/tyrax/ps2link/ps2link-low-nousb-packed.elf
            echo "image OK"
          '
          echo "--- toolchain identity (must not drift silently):"
          docker run --rm tyrax-toolchain:ci sh -c 'mips64r5900el-ps2-elf-g++ --version | head -1; vclpp 2>&1 | head -3'

      # The console loader, so it can be downloaded without pulling the image
      # (docs/ps2link-setup.md). Retention is the default 90 days; the image
      # itself is the durable copy.
      - name: Extract ps2link
        run: |
          cid=$(docker create tyrax-toolchain:ci)
          mkdir -p artifacts
          docker cp "$cid:/usr/local/share/tyrax/ps2link/." artifacts/
          docker rm "$cid" > /dev/null
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ps2link
          path: artifacts/*.elf
          if-no-files-found: error

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest for humans, :sha-<commit> as the thing to pin a project to when a
      # build has to be reproducible (TYRAX_IMAGE takes any reference).
      - name: Push
        if: github.event_name != 'pull_request' && inputs.push != false
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### TyraX toolchain image"
            echo
            echo '`'"${IMAGE}"'`'
            echo
            echo "Point a project at it with one line in the project directory:"
            echo
            echo '```'
            echo "TYRAX_IMAGE=${IMAGE}:sha-${{ github.sha }}"
            echo '```'
            echo
            echo "written to \`.env\` - see docs/toolchain-image.md."
          } >> "$GITHUB_STEP_SUMMARY"
