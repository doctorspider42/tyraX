name: large-terrain
volumes:
  tyra-game-volume:
  tyra-engine:
    name: tyra-engine-0be53feb
services:
  compiler:
    environment:
      TERM: xterm-256color
    network_mode: host
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    volumes:
      - tyra-game-volume:/src
      - tyra-engine:/tyra
      - ./:/host
      - "D:/tyra-editor/vendor/tyra:/engine-src:ro"
