name: script-demo
volumes:
  tyra-game-volume:
  tyra-engine:
    name: tyra-engine-shared
services:
  compiler:
    environment:
      TERM: xterm-256color
    network_mode: host
    build:
      context: ./
      dockerfile: Dockerfile
    tty: true
    volumes:
      - tyra-game-volume:/src
      - tyra-engine:/tyra
      - ./:/host
      - "F:/Projects/tyra-editor/.claude/worktrees/animation-engine-improvements-a18f19/vendor/tyra:/engine-src:ro"
